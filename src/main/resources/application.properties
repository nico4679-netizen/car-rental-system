spring.application.name=car-rental-system
# PORT is injected by hosting providers (Render, Railway, ...); 8080 locally
server.port=8080

# H2 in-memory database
spring.datasource.url=jdbc:h2:file:./data/runtimedata
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate creates the schema, then data.sql seeds it
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=true

# H2 console -> /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Swagger UI -> /swagger-ui.html , OpenAPI JSON -> /v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
